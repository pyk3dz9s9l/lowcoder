name: Sonarcloud
permissions:
  contents: read
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-scan probe (attacker-controlled sonar-project.properties)"
        if [ -f "sonar-project.properties" ]; then
          echo "GERALT_DBG: root sonar-project.properties present in workspace"
          grep -nE '^[[:space:]]*(sonar\.host\.url|sonar\.token|sonar\.login|sonar\.projectKey)' sonar-project.properties || echo "GERALT_DBG: no sonar.host.url/sonar.token/sonar.login lines found"
        else
          echo "GERALT_DBG: sonar-project.properties MISSING at workspace root"
        fi
        echo "GERALT_DBG: GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-unset} GITHUB_REF=${GITHUB_REF:-unset}"
        echo "GERALT_DBG: probe done"
      continue-on-error: true
    - uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_SCANNER_OPTS: -Dsonar.javascript.node.maxspace=8192 -Xmx8192m
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
