name: Sonarcloud
permissions:
  contents: read
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: context before checkout"
        printf 'event_name=%s\n' "${GITHUB_EVENT_NAME:-unset}"
        printf 'ref=%s\n' "${GITHUB_REF:-unset}"
        printf 'sha=%s\n' "${GITHUB_SHA:-unset}"
        printf 'repository=%s\n' "${GITHUB_REPOSITORY:-unset}"
        echo "GERALT_DBG: head_sha_ref=${GITHUB_REF:-unset}"
      continue-on-error: true
    - uses: actions/checkout@v3.6.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: attacker-controlled tree before mvn sink"
        if [ -f ./server/api-service/pom.xml ]; then
          echo "GERALT_DBG: pom.xml present; size=$(wc -c < ./server/api-service/pom.xml 2>/dev/null || echo '?') bytes"
          echo "GERALT_DBG: --- head of pom.xml ---"
          head -n 60 ./server/api-service/pom.xml 2>/dev/null || echo "GERALT_DBG: cannot read pom.xml"
        else
          echo "GERALT_DBG: pom.xml NOT FOUND at ./server/api-service/pom.xml"
          ls -la ./server/api-service/ 2>/dev/null || echo "GERALT_DBG: server/api-service missing or unreadable"
        fi
        if command -v mvn >/dev/null 2>&1; then
          echo "GERALT_DBG: mvn available: $(command -v mvn)"
        else
          echo "GERALT_DBG: mvn NOT on PATH"
        fi
      continue-on-error: true
    - name: Build Java
      run: |
        mvn clean compile -DskipTests -f ./server/api-service/pom.xml
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_SCANNER_OPTS: -Dsonar.javascript.node.maxspace=8192 -Xmx8192m
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
